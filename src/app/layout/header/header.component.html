<header class="site-header">
    <a class="site-header__home" [href]="homeHref" aria-label="回首頁">
        <img class="site-header__logo" src="assets/images/logo.png" width="360" height="120" alt="諾亞數智">
    </a>
    <span class="site-header__product">Noah Portal</span>
    <div class="site-header__actions">
        @if (user(); as current) {
            <div class="site-header__account" #account>
                <button type="button"
                    class="site-header__name"
                    aria-haspopup="menu"
                    [attr.aria-expanded]="isMenuOpen"
                    (click)="toggleMenu()">
                    <span class="site-header__name-text">{{ employeeName()?.displayName || current.displayName }}</span>
                    <span class="site-header__caret" aria-hidden="true"></span>
                </button>
                @if (isMenuOpen) {
                    <div class="site-header__menu" role="menu">
                        <a class="site-header__menu-item" role="menuitem" [href]="passwordHref" (click)="closeMenu()">變更密碼</a>
                    </div>
                }
            </div>
            <form class="site-header__logout" action="/auth/logout" method="post">
                <button class="site-header__logout-button" type="submit">登出</button>
            </form>
        }
    </div>
</header>
