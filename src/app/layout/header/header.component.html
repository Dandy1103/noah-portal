<header class="portal-header u-flex u-items-center u-gap-md u-px-md u-bg-brand u-text-on-brand">

    <span class="portal-header__product u-nowrap u-text-sm u-font-semibold">Noah Portal</span>
    @if (user(); as currentUser) {

            <a class="portal-header__action u-nowrap u-px-sm u-py-sm" href="/auth/change-password">變更密碼</a>
            <button class="portal-header__action u-nowrap u-px-sm u-py-sm" type="submit">登出</button>

    }
